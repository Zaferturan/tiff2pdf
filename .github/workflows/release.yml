name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (ör. v1.1.0)"
        required: true
        default: "v1.2.0"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true

      - name: Install LibTIFF (tiff2pdf) into vendor
        shell: pwsh
        run: |
          conda install -y -c conda-forge libtiff
          $bin = "$env:CONDA_PREFIX\Library\bin"
          New-Item -ItemType Directory -Force -Path vendor | Out-Null
          Copy-Item "$bin\tiff2pdf.exe" vendor\
          Get-ChildItem "$bin\tiff*.dll" | Copy-Item -Destination vendor\
          Get-ChildItem "$bin\libtiff*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination vendor\

      - name: Install Python deps and build
        run: |
          python -m pip install -r requirements.txt
          pyinstaller --noconfirm tiff2pdf.spec

      - name: Create zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist\Tiff2Pdf.exe -DestinationPath Tiff2Pdf-Windows.zip -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          files: Tiff2Pdf-Windows.zip
          generate_release_notes: true

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tiff2Pdf-Windows
          path: Tiff2Pdf-Windows.zip
