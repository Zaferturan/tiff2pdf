name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (ör. v1.2.1)"
        required: true
        default: "v1.2.1"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true

      - name: Install LibTIFF (tiff2pdf) into vendor
        shell: pwsh
        run: |
          conda install -y -c conda-forge libtiff
          $bin = "$env:CONDA_PREFIX\Library\bin"
          New-Item -ItemType Directory -Force -Path vendor | Out-Null
          Copy-Item "$bin\tiff2pdf.exe" vendor\
          Get-ChildItem "$bin\tiff*.dll" | Copy-Item -Destination vendor\
          Get-ChildItem "$bin\libtiff*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination vendor\

      - name: Install Python deps and build (one-file)
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          Remove-Item -Recurse -Force build, dist -ErrorAction SilentlyContinue
          pyinstaller --noconfirm --clean tiff2pdf.spec

      - name: Verify single exe (no _internal in dist)
        shell: pwsh
        run: |
          Write-Host "=== dist tree ==="
          Get-ChildItem dist -Recurse | ForEach-Object {
            Write-Host ("{0,-12} {1}" -f $_.Length, $_.FullName)
          }
          if (Test-Path "dist\Tiff2Pdf\_internal") {
            throw "HATA: one-folder build (_internal). Tek exe bekleniyordu."
          }
          if (-not (Test-Path "dist\Tiff2Pdf.exe")) {
            throw "HATA: dist\Tiff2Pdf.exe bulunamadı."
          }
          $mb = [math]::Round((Get-Item "dist\Tiff2Pdf.exe").Length / 1MB, 1)
          Write-Host "OK: tek exe, boyut ${mb} MB"

      - name: Create zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist\Tiff2Pdf.exe -DestinationPath Tiff2Pdf-Windows.zip -Force
          $zipMb = [math]::Round((Get-Item Tiff2Pdf-Windows.zip).Length / 1MB, 1)
          Write-Host "Zip boyutu: ${zipMb} MB (yalnızca Tiff2Pdf.exe)"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          files: Tiff2Pdf-Windows.zip
          generate_release_notes: true
          overwrite_files: true

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tiff2Pdf-Windows
          path: Tiff2Pdf-Windows.zip
